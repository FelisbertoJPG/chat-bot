# Chatbot do IPASEM: o Apache repassa /chatbot/ para o servidor do chatbot em 127.0.0.1:5000.
# Assim a página do site fala com o chatbot no mesmo endereço, sem abrir porta nova (o chatbot
# continua aceitando só conexões da própria máquina).
# Instalado por scripts/linux/instalar.sh em /etc/apache2/conf-available/chatbot.conf.

RedirectMatch ^/chatbot$ /chatbot/

<Location /chatbot/>
    # flushpackets=on: repassa cada pedaço da resposta assim que chega. Sem isso o Apache
    # junta tudo e a resposta aparece de uma vez no fim, em vez de ir surgindo.
    # timeout=600: com raciocínio ligado a resposta pode levar minutos.
    ProxyPass http://127.0.0.1:5000/ flushpackets=on timeout=600
    ProxyPassReverse http://127.0.0.1:5000/
    # Compactar (gzip) também segura o texto até o fim.
    SetEnv no-gzip 1
    RequestHeader unset Accept-Encoding
</Location>
