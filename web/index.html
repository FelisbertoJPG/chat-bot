<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot do IPASEM</title>
<style>
  :root {
    --bg: #f6f6f4; --painel: #ffffff; --borda: #e3e2de; --texto: #1f1f1d; --suave: #6b6a66;
    --destaque: #2f6f5e; --destaque-texto: #ffffff; --usuario: #e8f1ee;
    --codigo: #f0efeb; --alerta: #fdecea; --alerta-borda: #e5a29a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --painel: #1f1f1d; --borda: #33332f; --texto: #ecebe7; --suave: #9b9a95;
      --destaque: #5fb39b; --destaque-texto: #0f1f1a; --usuario: #22302c;
      --codigo: #262623; --alerta: #3a1f1c; --alerta-borda: #8a3d35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--texto);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  aside {
    width: 220px; flex-shrink: 0; border-right: 1px solid var(--borda); background: var(--painel);
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  #nova {
    width: 100%; padding: 10px 12px; border: 1px solid var(--destaque); border-radius: 8px;
    background: var(--bg); color: var(--texto); font: inherit; font-weight: 600; cursor: pointer; text-align: left;
  }
  #nova:hover { background: var(--usuario); }
  aside .rodape { margin-top: auto; font-size: 12px; color: var(--suave); }
  aside label { display: block; margin-bottom: 8px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #conversa { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .msg { max-width: 760px; margin: 0 auto 20px; }
  .msg.usuario .balao { background: var(--usuario); margin-left: auto; width: fit-content; max-width: 85%; }
  .balao { padding: 12px 16px; border-radius: 12px; background: var(--painel); border: 1px solid var(--borda); }
  .status { font-size: 13px; color: var(--suave); font-style: italic; }
  .detalhes { margin-top: 8px; font-size: 13px; }
  details { border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; margin-top: 6px; background: var(--painel); }
  summary { cursor: pointer; color: var(--suave); }
  .fonte { border-top: 1px solid var(--borda); padding: 8px 0; }
  .fonte:first-of-type { border-top: 0; }
  .fonte b { color: var(--destaque); }
  .fonte .pedaco { color: var(--suave); }
  .fonte pre {
    white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--codigo);
    padding: 8px; border-radius: 6px; margin: 6px 0 0;
  }
  .metricas { font-size: 12px; color: var(--suave); margin-top: 6px; }
  .lista-rede {
    margin-top: 8px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
    background: var(--painel); border: 1px solid var(--destaque);
  }
  .assuntos, .opcoes-menu, .botoes-troca { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .vazio .assuntos {
    flex-direction: column; flex-wrap: nowrap; width: 100%; max-width: 420px; margin: 20px auto 0;
  }
  .assunto, .opcao-menu, .botao-troca {
    padding: 8px 12px; border: 1px solid var(--borda); border-radius: 8px; background: var(--bg);
    color: var(--texto); font: inherit; font-size: 14px; cursor: pointer; text-align: left;
  }
  .assunto { font-weight: 600; }
  .vazio .assunto { padding: 12px 16px; font-size: 15px; }
  .botao-troca.principal { border-color: var(--destaque); font-weight: 600; }
  .assunto:hover, .opcao-menu:hover, .botao-troca:hover { border-color: var(--destaque); }
  button:disabled { opacity: .5; cursor: default; }
  .chip-assunto {
    display: inline-flex; align-items: center; gap: 8px; padding: 2px 4px 2px 10px;
    border: 1px solid var(--destaque); border-radius: 999px; color: var(--texto);
  }
  .chip-assunto[hidden] { display: none; }
  .chip-assunto button {
    border: 0; border-radius: 999px; padding: 2px 8px; background: var(--usuario); color: var(--texto);
    cursor: pointer; font: inherit; font-size: 12px;
  }
  .links-guia { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .link-guia {
    padding: 6px 10px; border: 1px solid var(--destaque); border-radius: 6px;
    color: var(--destaque); text-decoration: none; font-weight: 600;
  }
  .link-guia:hover { background: var(--bg); }
  .prestador { border-top: 1px solid var(--borda); padding: 8px 0; }
  .prestador[hidden] { display: none; }
  .prestador.destaque { background: var(--usuario); border-radius: 8px; padding: 8px 10px; }
  .chips-bairro { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .chip-bairro {
    padding: 2px 10px; border: 1px solid var(--borda); border-radius: 999px; background: var(--bg);
    color: var(--texto); font: inherit; font-size: 12px; cursor: pointer;
  }
  .chip-bairro.ativo { border-color: var(--destaque); background: var(--usuario); font-weight: 600; }
  .ver-todos {
    margin-top: 6px; padding: 6px 12px; border: 1px solid var(--destaque); border-radius: 8px;
    background: var(--bg); color: var(--destaque); font: inherit; font-weight: 600; cursor: pointer;
  }
  .form-rede { display: grid; gap: 10px; margin-top: 12px; max-width: 460px; }
  .form-rede label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
  .form-rede .nota { font-weight: 400; color: var(--suave); }
  .form-rede select, .lista-busca > button {
    width: 100%; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 8px;
    background: var(--bg); color: var(--texto); font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .form-rede select:focus, .lista-busca > button:focus { outline: 2px solid var(--destaque); }
  .lista-busca { position: relative; }
  .lista-busca > button:disabled { cursor: not-allowed; }
  .lista-busca > button::after { content: "▾"; float: right; color: var(--suave); }
  .painel-busca {
    position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; padding: 8px;
    border: 1px solid var(--destaque); border-radius: 8px; background: var(--painel);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .15);
  }
  .painel-busca[hidden] { display: none; }
  .painel-busca input {
    width: 100%; padding: 7px 9px; border: 1px solid var(--borda); border-radius: 6px;
    background: var(--bg); color: var(--texto); font: inherit; font-size: 14px;
  }
  .itens-busca { max-height: 220px; overflow-y: auto; margin-top: 6px; }
  .item-busca {
    display: block; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: none;
    color: var(--texto); font: inherit; font-size: 14px; text-align: left; cursor: pointer;
  }
  .item-busca:hover, .item-busca.escolhido { background: var(--usuario); }
  .item-busca .qtd { color: var(--suave); font-size: 12px; }
  .buscar-rede {
    justify-self: start; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--destaque);
    color: var(--destaque-texto); font: inherit; font-weight: 600; cursor: pointer;
  }
  .alerta {
    margin-bottom: 8px; padding: 10px 12px; border-radius: 8px; font-weight: 600;
    background: var(--alerta); border: 1px solid var(--alerta-borda); color: var(--texto);
  }
  .nao-era {
    margin-left: 6px; padding: 2px 8px; border: 1px solid var(--borda); border-radius: 6px;
    background: var(--bg); color: var(--texto); font: inherit; font-size: 12px; cursor: pointer;
  }
  .nao-era:hover { border-color: var(--destaque); }
  .vazio { max-width: 760px; margin: 80px auto; text-align: center; color: var(--suave); }
  .vazio h2 { color: var(--texto); font-size: 20px; margin: 0; }
  form { border-top: 1px solid var(--borda); background: var(--painel); padding: 12px 20px 16px; }
  .entrada { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 12px; border-radius: 10px;
    border: 1px solid var(--borda); background: var(--bg); color: var(--texto); font: inherit;
  }
  textarea:focus { outline: 2px solid var(--destaque); border-color: transparent; }
  textarea:disabled { opacity: .6; cursor: not-allowed; }
  button.enviar {
    padding: 0 18px; border: 0; border-radius: 10px; background: var(--destaque); color: var(--destaque-texto);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .opcoes { max-width: 760px; margin: 8px auto 0; font-size: 13px; color: var(--suave); min-height: 26px; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    aside { width: auto; flex-direction: row; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--borda); }
    #nova { width: auto; }
    aside .rodape { margin: 0 0 0 auto; }
    aside .rodape p { display: none; }
    #conversa, form { padding-left: 16px; padding-right: 16px; }
    .vazio { margin-top: 32px; }
  }
</style>
</head>
<body>
<aside>
  <button id="nova" type="button" title="Esquece as perguntas anteriores e volta para a escolha do assunto">＋ Nova conversa</button>
  <div class="rodape">
    <label title="Mais preciso, bem mais lento"><input type="checkbox" id="pensar"> Pensar antes de responder</label>
    <p>As perguntas são registradas, sem CPF, telefone ou e-mail, para melhorar as respostas.</p>
  </div>
</aside>

<main>
  <div id="conversa"></div>

  <form id="form">
    <div class="entrada">
      <textarea id="pergunta" rows="1" disabled placeholder="Escolha um assunto acima para começar"></textarea>
      <button class="enviar" id="enviar" type="submit" disabled>Enviar</button>
    </div>
    <div class="opcoes">
      <span class="chip-assunto" id="chip-assunto" hidden>
        <span id="chip-texto"></span><button type="button" id="trocar-assunto">Trocar assunto</button>
      </span>
    </div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
let ocupado = false;
// Conversa: as trocas desta tela vão junto com a próxima pergunta digitada, para o chatbot
// entender continuações. Guarda a pergunta já completa (reescrita), não a digitada.
let conversa = [];
const TROCAS_ENVIADAS = 3;

function escapar(texto) {
  return texto.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Markdown mínimo: **negrito** e quebras de linha.
function formatar(texto) {
  return escapar(texto).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
}

// Texto do guia (markdown simples): títulos ###, linhas de tabela e **negrito**.
function formatarGuia(texto) {
  const linhas = texto.split("\n")
    .filter((l) => !/^\|[-| ]+\|$/.test(l.trim()))  // linha separadora de tabela
    .map((l) => {
      if (/^#{2,4} /.test(l)) return `**${l.replace(/^#+ /, "")}**`;
      if (/^\|.*\|$/.test(l.trim())) return "• " + l.trim().slice(1, -1).split("|").map((c) => c.trim()).join(" — ");
      return l;
    });
  return formatar(linhas.join("\n"));
}

function cartaoLinks(links) {
  const botoes = links.map((l) =>
    `<a class="link-guia" href="${escapar(l.url)}" target="_blank" rel="noopener">${escapar(l.nome)}</a>`).join("");
  return `<div class="lista-rede"><b>Faça pelo app ou pelo site do IPASEM</b><div class="links-guia">${botoes}</div></div>`;
}

// "ORTOPEDIA E TRAUMATOLOGIA" -> "Ortopedia e Traumatologia" (o cadastro vem em maiúsculas).
function bonito(texto) {
  const minusculas = new Set(["e", "de", "da", "do", "das", "dos", "em"]);
  return texto.toLowerCase().split(" ").map((p, i) =>
    i && minusculas.has(p) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
}

// Lista da rede credenciada, direto do cadastro: 5 primeiros, "Ver todos" e filtro por bairro.
const NA_LISTA = 5;
function cartaoRede(lista, titulo = "") {
  const ps = lista.prestadores;
  // O mesmo bairro vem com grafias diferentes ("H VELHO", "MAUA", "JARDIM MAUÁ"): agrupa pela forma
  // normalizada (bairro_id) e mostra a grafia acentuada, ou a mais comum.
  const idBairro = (p) => p.bairro_id || semAcento(p.bairro || "");
  const bairros = {};
  ps.forEach((p) => {
    if (!p.bairro) return;
    const b = bairros[idBairro(p)] = bairros[idBairro(p)] || { total: 0, grafias: {} };
    b.total++;
    b.grafias[p.bairro] = (b.grafias[p.bairro] || 0) + 1;
  });
  const rotulo = (b) => Object.entries(b.grafias)
    .sort((x, y) => (semAcento(y[0]) !== y[0].toLowerCase()) - (semAcento(x[0]) !== x[0].toLowerCase()) || y[1] - x[1])[0][0];
  const chips = Object.keys(bairros).length > 1
    ? `<div class="chips-bairro"><button type="button" class="chip-bairro ativo" data-bairro="">Todos os bairros</button>${
        Object.entries(bairros).sort((a, b) => b[1].total - a[1].total).map(([id, b]) =>
          `<button type="button" class="chip-bairro" data-bairro="${escapar(id)}">${escapar(bonito(rotulo(b)))} (${b.total})</button>`).join("")}</div>` : "";
  const cartoes = ps.map((p, i) => `
    <div class="prestador${p.destaque ? " destaque" : ""}" data-bairro-do="${escapar(p.bairro ? idBairro(p) : "")}"${i >= NA_LISTA ? " hidden" : ""}><b>${p.destaque ? "⭐ " : ""}${escapar(p.nome)}</b>${p.local ? ` · ${escapar(p.local)}` : ""}<br>
    ${escapar(bonito(p.especialidade))}<br>${escapar([p.endereco, p.bairro, p.cidade].filter(Boolean).join(", "))}<br>
    📞 ${escapar(p.telefones.filter((t) => /\d/.test(t)).join(" / ") || "telefone não informado")}</div>`).join("");
  const cidades = Object.entries(lista.por_cidade).map(([c, n]) => `${escapar(bonito(c))} ${n}`).join(" · ");
  const mais = ps.length > NA_LISTA ? `<button type="button" class="ver-todos" data-ver-todos="1">Ver todos os ${ps.length}</button>` : "";
  return `<div class="lista-rede">
    <b>${titulo || (lista.titulo ? escapar(lista.titulo) : `Rede credenciada: ${escapar(lista.especialidades.map(bonito).join(", "))}`)} (dados de ${escapar(lista.dados_de)})</b>
    ${ps.length ? "" : `<div class="metricas">Onde há: ${cidades}</div>`}${chips}${cartoes}${mais}
    <div class="metricas">${escapar(lista.aviso)}</div></div>`;
}

// Filtro por bairro e "Ver todos": tudo na própria página, sem pedir nada ao servidor.
function atualizarLista(caixa) {
  const bairro = caixa.dataset.filtro || "";
  const aberta = caixa.dataset.aberta === "1" || bairro;
  const cartoes = [...caixa.querySelectorAll(".prestador")];
  let i = 0;
  cartoes.forEach((c) => {
    const passa = !bairro || c.dataset.bairroDo === bairro;
    c.hidden = !passa || (!aberta && i >= NA_LISTA);
    if (passa) i++;
  });
  const botao = caixa.querySelector(".ver-todos");
  if (botao) botao.hidden = !!aberta;
  caixa.querySelectorAll(".chip-bairro").forEach((b) => b.classList.toggle("ativo", b.dataset.bairro === bairro));
}

// Registro dos cliques (registro.py, no servidor). Falhar aqui nunca atrapalha a conversa.
function registrar(dados) {
  fetch("api/registrar", { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify(dados) }).catch(() => {});
}

function rolarParaBaixo() {
  const c = $("conversa");
  c.scrollTop = c.scrollHeight;
}

function adicionarMensagem(classe) {
  $("vazio")?.remove();
  const msg = document.createElement("div");
  msg.className = `msg ${classe}`;
  $("conversa").appendChild(msg);
  return msg;
}

// --- Assuntos (menu.json): a conversa começa pela escolha do assunto -------------------------
// O assunto vai junto com cada pergunta digitada e diz ao chatbot onde procurar (rede: só a
// rede; autorizações/app: guia; regulamento: artigos e tabela). Sem assunto, não dá para digitar.
let MENU = { assuntos: [] };
let assuntoAtual = null;

const acharAssunto = (id) => MENU.assuntos.find((a) => a.id === id);

function marcarAssunto(assunto) {
  assuntoAtual = assunto ? assunto.id : null;
  $("chip-assunto").hidden = !assunto;
  $("chip-texto").textContent = assunto ? `Assunto: ${assunto.icone} ${assunto.titulo}` : "";
  $("pergunta").disabled = !assunto;
  $("enviar").disabled = !assunto || ocupado;
  $("pergunta").placeholder = assunto
    ? (assunto.exemplo || "Escreva a sua dúvida sobre este assunto")
    : "Escolha um assunto acima para começar";
}

function botoesAssuntos() {
  return `<div class="assuntos">${MENU.assuntos.map((a) =>
    `<button type="button" class="assunto" data-assunto="${escapar(a.id)}">${escapar(a.icone)} ${escapar(a.titulo)}</button>`).join("")}</div>`;
}

function telaInicial(texto = "") {
  conversa = [];
  ultimaBuscaRede = null;
  marcarAssunto(null);
  $("conversa").innerHTML = `<div class="vazio" id="vazio">${texto ? `<p>${escapar(texto)}</p>` : ""}
    <h2>Escolha um assunto para iniciar a conversa</h2>${botoesAssuntos()}</div>`;
}

async function carregarMenu() {
  try { MENU = await (await fetch("api/menu")).json(); } catch { MENU = { assuntos: [] }; }
  telaInicial();
}

function abrirMenu() {
  marcarAssunto(null);
  const msg = adicionarMensagem("assistente");
  msg.innerHTML = `<div class="balao">Sobre o que você quer falar agora?${botoesAssuntos()}</div>`;
  rolarParaBaixo();
}

function abrirAssunto(id) {
  const assunto = acharAssunto(id);
  if (!assunto) return;
  registrar({ tipo: "assunto", assunto: id });
  ultimaBuscaRede = null;
  adicionarMensagem("usuario").innerHTML = `<div class="balao">${escapar(assunto.icone)} ${escapar(assunto.titulo)}</div>`;
  const msg = adicionarMensagem("assistente");
  marcarAssunto(assunto);
  if (assunto.fluxo === "rede") { mostrarFormRede(msg, assunto); return; }
  const opcoes = assunto.opcoes.length
    ? `<div class="opcoes-menu">${assunto.opcoes.map((o, j) =>
        `<button type="button" class="opcao-menu" data-opcao="${escapar(id)}:${j}">${escapar(o.titulo)}</button>`).join("")}</div>
       <div class="metricas">Ou escreva a sua dúvida sobre este assunto aqui embaixo.</div>`
    : `<div class="metricas">Pode escrever aqui embaixo.</div>`;
  msg.innerHTML = `<div class="balao">${escapar(assunto.aviso)}${opcoes}</div>`;
  rolarParaBaixo();
  $("pergunta").focus();
}

// Resposta pronta do guia: na hora, sem passar pelo modelo.
function responderOpcao(id, j) {
  const opcao = acharAssunto(id).opcoes[j];
  registrar({ tipo: "botao", assunto: id, opcao: opcao.titulo });
  adicionarMensagem("usuario").innerHTML = `<div class="balao">${escapar(opcao.titulo)}</div>`;
  const msg = adicionarMensagem("assistente");
  const passo = opcao.passo_a_passo
    ? `<details><summary>Passo a passo completo</summary>
       <div class="fonte">${formatarGuia(opcao.passo_a_passo.texto)}</div></details>` : "";
  msg.innerHTML = `<div class="balao">${formatarGuia(opcao.resposta)}</div>
    <div class="detalhes">${cartaoLinks(opcao.links)}${passo}
    <div class="metricas">Ainda com dúvida? Escreva aqui embaixo.</div></div>`;
  // Entra na conversa: "e no app?" logo depois é entendido como continuação.
  conversa.push({ pergunta: opcao.titulo, resposta: opcao.resposta });
  rolarParaBaixo();
}

// --- Rede credenciada pela página: cidade (obrigatória) + especialidade (opcional), sem modelo --
let CIDADES = null;
// Última busca feita no quadro da rede: vai junto com as perguntas, para a busca por nome saber
// em que especialidade a pessoa está ("quero o doutor Fernando" com Análises Clínicas escolhida).
let ultimaBuscaRede = null;
const semAcento = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

async function mostrarFormRede(msg, assunto) {
  try { CIDADES = CIDADES || (await (await fetch("api/rede/cidades")).json()).cidades; } catch { CIDADES = []; }
  msg.innerHTML = `<div class="balao">${escapar(assunto.aviso)}
    <div class="form-rede">
      <label>Cidade <span class="nota">(obrigatória)</span>
        <select class="campo-cidade"><option value="">Escolha a cidade</option>${CIDADES.map((c) =>
          `<option value="${escapar(c.id)}">${escapar(bonito(c.nome))} (${c.total})</option>`).join("")}</select></label>
      <div><label>Especialidade <span class="nota">[opcional]</span></label>
        <div class="lista-busca">
          <button type="button" class="abrir-busca" disabled>Escolha a cidade primeiro</button>
          <div class="painel-busca" hidden>
            <input type="search" class="pesquisa" placeholder="Pesquisar especialidade..." autocomplete="off">
            <div class="itens-busca"></div>
          </div>
        </div></div>
      <button type="button" class="buscar-rede" disabled>Buscar</button>
    </div></div>`;
  const form = msg.querySelector(".form-rede");
  const campoCidade = form.querySelector(".campo-cidade");
  const abrir = form.querySelector(".abrir-busca"), painel = form.querySelector(".painel-busca");
  const pesquisa = form.querySelector(".pesquisa"), itens = form.querySelector(".itens-busca");
  const buscar = form.querySelector(".buscar-rede");
  let especialidades = [], escolhida = "";

  function desenharItens() {
    const termo = semAcento(pesquisa.value.trim());
    const todas = [{ nome: "", total: null }, ...especialidades];  // "" = todas as especialidades
    itens.innerHTML = todas.filter((e) => !termo || semAcento(e.nome).includes(termo)).map((e) =>
      `<button type="button" class="item-busca${e.nome === escolhida ? " escolhido" : ""}" data-valor="${escapar(e.nome)}">
        ${e.nome ? escapar(bonito(e.nome)) : "<i>Todas as especialidades</i>"}${e.total ? ` <span class="qtd">(${e.total})</span>` : ""}</button>`).join("")
      || `<div class="metricas">Nenhuma especialidade com esse nome nesta cidade.</div>`;
  }
  function escolher(nome) {
    escolhida = nome;
    abrir.textContent = nome ? bonito(nome) : "Todas as especialidades";
    painel.hidden = true;
  }

  campoCidade.onchange = async () => {
    escolher("");
    buscar.disabled = abrir.disabled = !campoCidade.value;
    if (!campoCidade.value) { abrir.textContent = "Escolha a cidade primeiro"; return; }
    abrir.textContent = "Carregando...";
    especialidades = (await (await fetch(`api/rede/especialidades?cidade=${encodeURIComponent(campoCidade.value)}`)).json()).especialidades;
    escolher("");
  };
  abrir.onclick = () => {
    painel.hidden = !painel.hidden;
    if (!painel.hidden) { pesquisa.value = ""; desenharItens(); pesquisa.focus(); }
  };
  pesquisa.oninput = desenharItens;
  pesquisa.onkeydown = (e) => {  // Enter escolhe a primeira da lista filtrada; Esc fecha
    if (e.key === "Enter") { e.preventDefault(); const p = itens.querySelector(".item-busca"); if (p) escolher(p.dataset.valor); }
    if (e.key === "Escape") painel.hidden = true;
  };
  itens.onclick = (e) => { const item = e.target.closest(".item-busca"); if (item) escolher(item.dataset.valor); };
  document.addEventListener("click", (e) => { if (!form.querySelector(".lista-busca").contains(e.target)) painel.hidden = true; });
  buscar.onclick = () => {
    if (ocupado || !campoCidade.value) return;
    const cidade = CIDADES.find((c) => c.id === campoCidade.value);
    buscarNaRede(cidade, escolhida);
  };
  rolarParaBaixo();
}

async function buscarNaRede(cidade, especialidade, destacar = null) {
  ultimaBuscaRede = { cidade: cidade.id, especialidade: especialidade || "" };
  const nomeCidade = bonito(cidade.nome);
  const pedido = especialidade ? `${bonito(especialidade)} em ${nomeCidade}` : `Todos os prestadores em ${nomeCidade}`;
  adicionarMensagem("usuario").innerHTML = `<div class="balao">${escapar(pedido)}</div>`;
  const msg = adicionarMensagem("assistente");
  msg.innerHTML = `<div class="balao"><span class="status">Procurando...</span></div>`;
  const url = `api/rede/lista?cidade=${encodeURIComponent(cidade.id)}` +
              (especialidade ? `&especialidade=${encodeURIComponent(especialidade)}` : "") +
              (destacar ? `&destacar=${encodeURIComponent(destacar)}` : "");
  const { lista } = await (await fetch(url)).json();
  if (!lista) { msg.innerHTML = `<div class="balao">Não encontrei ninguém com essa escolha. Tente outra cidade ou especialidade.</div>`; return; }
  const n = lista.prestadores.length;
  const texto = (especialidade
    ? `Encontrei ${n} de ${bonito(especialidade)} em ${nomeCidade}.`
    : `Encontrei ${n} prestadores em ${nomeCidade}. Para ver só uma especialidade, escolha no quadro acima.`) +
    (destacar ? ` Quem tem o nome “${destacar}” aparece primeiro, com ⭐.` : "") +
    " A rede muda com frequência: confirme por telefone antes de ir.";
  const titulo = especialidade ? "" : `Rede credenciada em ${escapar(nomeCidade)}`;
  msg.innerHTML = `<div class="balao">${escapar(texto)}</div><div class="detalhes">${cartaoRede(lista, titulo)}
    <div class="metricas">Dá para filtrar por bairro nos botões acima da lista. Outra dúvida? Escreva aqui embaixo.</div></div>`;
  // Entra na conversa: "e em São Leopoldo?" depois é entendido como continuação.
  conversa.push({ pergunta: especialidade ? `Quem atende ${bonito(especialidade)} em ${nomeCidade}?`
                                          : `Quem atende em ${nomeCidade}?`, resposta: texto });
  rolarParaBaixo();
}

// A pergunta parece ser de outro assunto: pergunta antes de responder.
function oferecerTroca(msg, ev, pergunta) {
  const atual = acharAssunto(ev.atual), sugerido = acharAssunto(ev.sugerido);
  if (!sugerido) { perguntar(pergunta, { manter: true, semBalao: true }); return; }
  msg.innerHTML = `<div class="balao">Essa pergunta parece ser sobre <b>${escapar(sugerido.icone)} ${escapar(sugerido.titulo)}</b>.
    Quer mudar de assunto?<div class="botoes-troca">
    <button type="button" class="botao-troca principal" data-troca="sim">Sim, mudar para ${escapar(sugerido.titulo)}</button>
    <button type="button" class="botao-troca" data-troca="nao">Não, continuar em ${escapar(atual ? atual.titulo : "este assunto")}</button>
    </div></div>`;
  msg.querySelectorAll("[data-troca]").forEach((b) => b.onclick = () => {
    if (ocupado) return;
    const aceitou = b.dataset.troca === "sim";
    msg.querySelectorAll("[data-troca]").forEach((x) => x.disabled = true);
    registrar({ tipo: "mudar_assunto", de: ev.atual, para: ev.sugerido, aceitou, pergunta });
    if (aceitou) marcarAssunto(sugerido);
    perguntar(pergunta, { manter: true, semBalao: true });
  });
}

document.addEventListener("click", (e) => {
  // Filtros da lista da rede: funcionam mesmo enquanto outra resposta está sendo gerada.
  const filtro = e.target.closest("[data-bairro], [data-ver-todos]");
  if (filtro) {
    const caixa = filtro.closest(".lista-rede");
    if (filtro.dataset.verTodos) caixa.dataset.aberta = "1";
    else caixa.dataset.filtro = filtro.dataset.bairro;
    atualizarLista(caixa);
    return;
  }
  const alvo = e.target.closest("[data-assunto], [data-opcao], [data-rede-esp]");
  if (!alvo || ocupado) return;
  if (alvo.dataset.redeEsp) {
    buscarNaRede({ id: alvo.dataset.redeCidade, nome: alvo.dataset.redeCidadeNome }, alvo.dataset.redeEsp, alvo.dataset.redeNome);
    return;
  }
  if (alvo.dataset.assunto !== undefined) abrirAssunto(alvo.dataset.assunto);
  else {
    const [id, j] = alvo.dataset.opcao.split(":");
    responderOpcao(id, Number(j));
  }
});

// --- Pergunta digitada ---------------------------------------------------------------------
// opcoes.manter: não oferece troca de assunto (já foi decidido). opcoes.semBalao: a pergunta já
// está na tela. opcoes.semConversa: "Não era isso", refaz sem a conversa.
async function perguntar(pergunta, opcoes = {}) {
  ocupado = true;
  $("enviar").disabled = true;

  if (!opcoes.semBalao) adicionarMensagem("usuario").innerHTML = `<div class="balao">${formatar(pergunta)}</div>`;
  const msg = adicionarMensagem("assistente");
  msg.innerHTML = `<div class="balao"><span class="status">Procurando...</span><span class="texto"></span></div><div class="detalhes"></div>`;
  const status = msg.querySelector(".status");
  const areaTexto = msg.querySelector(".texto");
  const detalhes = msg.querySelector(".detalhes");
  rolarParaBaixo();

  const inicio = Date.now();
  const cronometro = setInterval(() => {
    if (status.dataset.base) status.textContent = `${status.dataset.base} ${Math.round((Date.now() - inicio) / 1000)}s`;
  }, 1000);

  let resposta = "";
  let entendida = pergunta;
  let troca = null;
  const historico = opcoes.semConversa ? [] : conversa.slice(-TROCAS_ENVIADAS);
  if (historico.length) status.textContent = status.dataset.base = "Entendendo a pergunta...";
  try {
    const r = await fetch("api/perguntar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pergunta, pensar: $("pensar").checked, historico,
                             assunto: assuntoAtual, manter_assunto: !!opcoes.manter,
                             filtro_rede: assuntoAtual === "rede" ? ultimaBuscaRede : null }),
    });
    const leitor = r.body.getReader();
    const decodificador = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await leitor.read();
      if (done) break;
      buffer += decodificador.decode(value, { stream: true });
      const linhas = buffer.split("\n");
      buffer = linhas.pop();

      for (const linha of linhas.filter(Boolean)) {
        const ev = JSON.parse(linha);
        if (ev.tipo === "mudar_assunto") {
          troca = ev;
        } else if (ev.tipo === "escolher_especialidade") {
          detalhes.insertAdjacentHTML("beforeend", `<div class="opcoes-menu">${ev.opcoes.map((o) =>
            `<button type="button" class="opcao-menu" data-rede-esp="${escapar(o.especialidade)}" data-rede-cidade="${escapar(o.cidade_id)}"
              data-rede-cidade-nome="${escapar(o.cidade)}" data-rede-nome="${escapar(ev.nome)}">${escapar(bonito(o.especialidade))} · ${escapar(bonito(o.cidade))} (${o.total})</button>`).join("")}</div>`);
        } else if (ev.tipo === "fontes") {
          status.dataset.base = "Gerando resposta...";
          if (ev.fontes.length) {
            const itens = ev.fontes.map((f) => `
              <div class="fonte">
                <b>${escapar(f.id)}</b> (${escapar(f.paginas)}) · similaridade ${f.similaridade.toFixed(3)}<br>
                <span class="pedaco">Trecho que casou: ${escapar(f.pedaco)}</span>
                <details><summary>Ver artigo inteiro</summary><pre>${escapar(f.texto)}</pre></details>
              </div>`).join("");
            detalhes.insertAdjacentHTML("beforeend",
              `<details><summary>Artigos consultados: ${ev.fontes.map((f) => escapar(f.id)).join(", ")}</summary>${itens}</details>`);
          }
        } else if (ev.tipo === "ferramenta") {
          const itens = ev.resumo.map((l) => `<div class="fonte">${escapar(l)}</div>`).join("");
          let titulo;
          if (ev.nome === "buscar_nome") {
            // Busca pelo nome direto no cadastro (sem modelo): só a lista, sem o resumo técnico.
            if (ev.lista) detalhes.insertAdjacentHTML("beforeend", cartaoRede(ev.lista));
            continue;
          } else if (ev.nome === "consultar_rede") {
            status.dataset.base = "Consultou a rede credenciada, gerando resposta...";
            const a = ev.argumentos;
            const onde = [a.bairro, a.cidade].filter(Boolean).join(", ");
            titulo = `🏥 Consultou a rede credenciada: ${escapar(a.especialidade || "")}${onde ? " em " + escapar(onde) : ""} (${ev.total} na rede)`;
          } else {
            status.dataset.base = "Consultou a tabela, gerando resposta...";
            const termo = ev.argumentos.termo || JSON.stringify(ev.argumentos);
            titulo = `🔎 Consultou a tabela por "${escapar(termo)}": ${ev.total} resultado(s)`;
          }
          detalhes.insertAdjacentHTML("beforeend",
            `<details><summary>${titulo}</summary>${itens || "<div class='fonte'>Nada encontrado.</div>"}</details>`);
          // Contatos direto do cadastro: o modelo não copia endereço nem telefone.
          if (ev.lista) detalhes.insertAdjacentHTML("beforeend", cartaoRede(ev.lista));
        } else if (ev.tipo === "guia") {
          // Links direto do código (guia.py): o modelo não escreve endereço de site.
          detalhes.insertAdjacentHTML("beforeend", cartaoLinks(ev.links));
          detalhes.insertAdjacentHTML("beforeend",
            `<details><summary>📱 ${escapar(ev.id)}: ${escapar(ev.titulo)}</summary>
             <div class="fonte">${formatarGuia(ev.texto)}</div></details>`);
        } else if (ev.tipo === "alerta") {
          msg.insertAdjacentHTML("afterbegin", `<div class="alerta">⚠️ ${escapar(ev.mensagem)}</div>`);
        } else if (ev.tipo === "reescrita") {
          entendida = ev.pergunta;
          status.dataset.base = "Procurando...";
          detalhes.insertAdjacentHTML("beforeend",
            `<div class="metricas">💬 Entendi como: “${escapar(ev.pergunta)}”
             <button type="button" class="nao-era">Não era isso: perguntar sem a conversa</button></div>`);
          const original = ev.original, entendidaErrada = ev.pergunta;
          detalhes.querySelector(".nao-era").onclick = (e) => {
            if (ocupado) return;
            e.target.disabled = true;
            // A troca mal entendida sai da conversa, para não atrapalhar as próximas.
            conversa = conversa.filter((t) => t.pergunta !== entendidaErrada);
            perguntar(original, { semConversa: true, manter: true });
          };
        } else if (ev.tipo === "memoria") {
          const itens = ev.itens.map((i) => `
            <div class="fonte"><b>${escapar(i.pergunta)}</b>${i.artigos.length ? ` (${escapar(i.artigos.join(", "))})` : ""}<br>${formatar(i.resposta)}</div>`).join("");
          const titulo = ev.modo === "exata"
            ? "✅ Resposta validada pela equipe"
            : `📌 ${ev.itens.length} resposta(s) validada(s) consultada(s)`;
          detalhes.insertAdjacentHTML("beforeend", `<details><summary>${titulo}</summary>${itens}</details>`);
        } else if (ev.tipo === "pensando") {
          status.dataset.base = "Pensando...";
        } else if (ev.tipo === "texto") {
          if (status.isConnected) status.remove();
          resposta += ev.texto;
          areaTexto.innerHTML = formatar(resposta);
        } else if (ev.tipo === "fim" && ev.origem !== "mudar_assunto") {
          let metricas;
          if (ev.origem === "memoria") {
            metricas = `✅ Resposta validada · ${ev.tempo_total}s`;
          } else if (ev.origem === "busca_nome") {
            metricas = `⚡ Busca direta no cadastro da rede · ${ev.tempo_total}s`;
          } else if (ev.origem === "cache") {
            metricas = `♻️ Resposta reaproveitada · ${ev.tempo_total}s (a primeira levou ${ev.tempo_original}s)`;
          } else {
            metricas = `${ev.tempo_total}s · ${ev.tokens_por_segundo} tokens/s`;
          }
          detalhes.insertAdjacentHTML("beforeend", `<div class="metricas">${metricas}</div>`);
        } else if (ev.tipo === "erro") {
          throw new Error(ev.mensagem);
        }
        rolarParaBaixo();
      }
    }
    if (resposta.trim()) conversa.push({ pergunta: entendida, resposta });
  } catch (erro) {
    if (status.isConnected) status.remove();
    areaTexto.innerHTML = `<span class="status">Erro: ${escapar(erro.message)}. O Ollama está aberto?</span>`;
  }

  clearInterval(cronometro);
  ocupado = false;
  $("enviar").disabled = !assuntoAtual;
  if (troca) oferecerTroca(msg, troca, pergunta);
  rolarParaBaixo();
  if (!troca) $("pergunta").focus();
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const pergunta = $("pergunta").value.trim();
  if (!pergunta || ocupado || !assuntoAtual) return;
  $("pergunta").value = "";
  perguntar(pergunta);
};

// Enter envia; Shift+Enter quebra linha.
$("pergunta").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});

// Nova conversa: esquece as trocas anteriores e volta para a escolha do assunto.
$("nova").onclick = () => { if (!ocupado) telaInicial("Nova conversa. As perguntas anteriores foram esquecidas."); };
$("trocar-assunto").onclick = () => { if (!ocupado) abrirMenu(); };

carregarMenu();
</script>
